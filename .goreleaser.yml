version: 2

project_name: graph2agent-mcp

before:
  hooks:
    - go mod download

builds:
  - id: graph2agent-mcp
    main: ./cmd/graph2agent-mcp
    binary: graph2agent-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/graph2agent/mcp/internal/server.Version={{ .Version }}

archives:
  - id: release
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  draft: true

snapshot:
  version_template: 0.0.0-dev.{{ .ShortCommit }}
