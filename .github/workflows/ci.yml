name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out MCP server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whitespace
        run: git diff --check

  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out MCP server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned graph2agent core
        id: core_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: graph2agent/graph2agent
          ref: v0.1.0
          path: .deps/graph2agent
          ssh-key: ${{ secrets.GRAPH2AGENT_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false

      - name: Fail closed if graph2agent core checkout failed
        if: always() && steps.core_checkout.outcome != 'success'
        shell: bash
        run: |
          {
            echo '## Private core checkout failed'
            echo
            echo 'The pinned `graph2agent/graph2agent@v0.1.0` dependency could not be checked out.'
            echo 'Confirm that this repository has a unique `GRAPH2AGENT_DEPLOY_KEY` whose public key has read-only access to the private core repository.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=Private core checkout failed::Unable to check out graph2agent/graph2agent@v0.1.0. Verify the read-only GRAPH2AGENT_DEPLOY_KEY secret.'
          exit 1

      - name: Set up Go
        if: success() && steps.core_checkout.outcome == 'success'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create local dependency workspace
        if: success() && steps.core_checkout.outcome == 'success'
        run: |
          test ! -e go.work
          test ! -e go.work.sum
          go work init .
          go work edit -replace=github.com/graph2agent/graph2agent@v0.1.0=./.deps/graph2agent

      - name: Verify
        if: success() && steps.core_checkout.outcome == 'success'
        run: make check test-race
