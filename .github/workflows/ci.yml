name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRAPH2AGENT_CORE_VERSION: 0.4.0
  GRAPH2AGENT_CORE_TAG: v0.4.0
  GRAPH2AGENT_CORE_COMMIT: 8cfebb6c73bfaca6177a584aa6f1019e42c1e1da

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out MCP server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whitespace
        run: git diff --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out MCP server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned graph2agent core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: graph2agent/graph2agent
          ref: ${{ env.GRAPH2AGENT_CORE_TAG }}
          path: .deps/graph2agent
          persist-credentials: false

      - name: Verify pinned graph2agent core revision
        shell: bash
        run: |
          set -euo pipefail
          expected=$GRAPH2AGENT_CORE_COMMIT
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'replace GRAPH2AGENT_CORE_COMMIT with the exact %s commit before merging\n' "$GRAPH2AGENT_CORE_TAG" >&2
            exit 1
          }
          actual=$(git -C .deps/graph2agent rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            printf 'graph2agent %s resolved to %s; expected %s\n' "$GRAPH2AGENT_CORE_TAG" "$actual" "$expected" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create local dependency workspace
        run: |
          test ! -e go.work
          test ! -e go.work.sum
          go work init .
          go work edit -replace=github.com/graph2agent/graph2agent@v${GRAPH2AGENT_CORE_VERSION}=./.deps/graph2agent

      - name: Verify
        run: make check test-race
