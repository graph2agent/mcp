name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out MCP server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whitespace
        run: git diff --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out MCP server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned graph2agent core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: graph2agent/graph2agent
          ref: v0.2.0
          path: .deps/graph2agent
          persist-credentials: false

      - name: Verify pinned graph2agent core revision
        shell: bash
        run: |
          set -euo pipefail
          expected=67c4c7d44c7a3ad673a41155a7db0e33fb663214
          actual=$(git -C .deps/graph2agent rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            printf 'graph2agent v0.2.0 resolved to %s; expected %s\n' "$actual" "$expected" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create local dependency workspace
        run: |
          test ! -e go.work
          test ! -e go.work.sum
          go work init .
          go work edit -replace=github.com/graph2agent/graph2agent@v0.2.0=./.deps/graph2agent

      - name: Verify
        run: make check test-race
